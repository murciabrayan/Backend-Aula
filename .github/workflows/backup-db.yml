name: Respaldo BD Supabase

# Respaldo automatico de produccion. Corre EN LA NUBE de GitHub, sin depender
# de que ningun PC este encendido. Respalda dos cosas:
#   1. La base de datos (Supabase), con pg_dump.
#   2. Todos los archivos subidos (documentos de alumnos, firmas, tareas,
#      cartas de permiso...), que viven en Cloudinary y NO en la base.
# Todo se CIFRA antes de guardarse (el repo es publico).
# Si falla cualquier paso (incluida la descarga de un solo archivo), el job
# falla y GitHub avisa por correo.

on:
  schedule:
    - cron: '0 5 * * *'      # 00:00 hora Colombia (05:00 UTC), todos los dias
  workflow_dispatch: {}       # permite ejecutarlo a mano desde la pestana Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}   # token de Google Drive (opcional)
    steps:
      - name: Obtener scripts del repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar respaldo de la base (pg_dump)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Quitar espacios/saltos de linea que puedan haber quedado al pegar el secreto
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          STAMP=$(date +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p out
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges \
            -f "out/gimnasio_${STAMP}.dump"
          ls -lh out/

      - name: Respaldar archivos subidos (Cloudinary)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          export PSQL=/usr/lib/postgresql/17/bin/psql
          export PYTHON=python3
          bash scripts/respaldar_archivos.sh archivos
          tar -czf "out/archivos_${STAMP}.tar.gz" -C archivos .
          ls -lh out/

      - name: Cifrar respaldos (AES-256)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          export PASSPHRASE="$(printf '%s' "$PASSPHRASE" | tr -d '\r\n')"
          for f in "out/gimnasio_${STAMP}.dump" "out/archivos_${STAMP}.tar.gz"; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass env:PASSPHRASE
            rm -f "$f"
          done
          rm -rf archivos
          ls -lh out/

      - name: Guardar en GitHub (artifact cifrado)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ env.STAMP }}
          path: out/*.enc
          retention-days: 90

      - name: Guardar en Google Drive (si esta configurado)
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy out/ gdrive:Backups-Gimnasio --include "*.enc" --log-level INFO
          # Los paquetes de archivos pesan mas: se conservan los ultimos 30 dias
          # para no llenar el Drive. Los respaldos de la base se conservan todos.
          rclone delete gdrive:Backups-Gimnasio --include "archivos_*.tar.gz.enc" --min-age 30d --log-level INFO
