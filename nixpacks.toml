[providers]
python = {}

[phases.setup]
nixPkgs = ["python313", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "gunicorn backend_project.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
